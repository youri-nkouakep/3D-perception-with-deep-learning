[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perception"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "matplotlib",
    "torch",
    "tqdm",
]

[project.optional-dependencies]
viz = ["open3d"]
dev = ["pytest", "ipykernel"]

[tool.pytest.ini_options]
addopts = "-p no:dash"

[tool.setuptools.packages.find]
where = ["src"]
