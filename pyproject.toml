[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "perception"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "matplotlib",
]

[project.optional-dependencies]
dev = ["pytest", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]
